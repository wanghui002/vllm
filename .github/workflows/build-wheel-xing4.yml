name: Build vLLM wheel (Xing4.0)

# 推送到 support_xing4_0 分支时自动构建；也支持在 Actions 页面手动触发
on:
  push:
    branches: [support_xing4_0]
  workflow_dispatch:

permissions:
  contents: write # 用于创建 GitHub Release 并上传 wheel

concurrency:
  group: wheel-xing4
  cancel-in-progress: false # 绝不取消正在编译的任务

jobs:
  build:
    # 临时云服务器上注册的 self-hosted runner（标签 vllm-builder）
    runs-on: [self-hosted, linux, x64, vllm-builder]
    timeout-minutes: 360
    env:
      CUDA_HOME: /usr/local/cuda-13.0
      RELEASE_TAG: vllm-xing4.0-py312-cu130
      # ccache 缓存在构建机本地持久化，重跑/重启后已编译单元自动命中
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime,file_macro,locale
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup toolchain paths
        run: |
          echo "${CUDA_HOME}/bin" >> "${GITHUB_PATH}"
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          export PATH="${CUDA_HOME}/bin:${HOME}/.cargo/bin:${PATH}"
          nvcc --version
          ccache --version
          cargo --version

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          python -m pip install -U pip
          pip install -r requirements/build/cuda.txt

      - name: Build wheel
        env:
          # 留 4 核给 runner 心跳/系统，避免满载导致失联
          MAX_JOBS: "12"
          NVCC_THREADS: "1"
        run: |
          set -euxo pipefail
          ccache -M 30G
          ccache -z
          python -m build --wheel --no-isolation -o dist
          ccache -s
          ls -lh dist

      - name: Inspect wheel contents
        run: python -m zipfile -l dist/*.whl | head -20

      - name: Upload wheel to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          WHEEL=$(ls dist/*.whl)
          printf '%s\n' \
            '## vLLM wheel for Xing4.0' \
            '' \
            '- 源码分支：`support_xing4_0`（同步自 zyp2014/vllm）' \
            '- Python：3.12 ｜ CUDA：13.0 ｜ torch：2.13.0' \
            '- 在 Ubuntu 24.04 (glibc 2.39) 上构建，要求测试机 glibc >= 2.39' \
            '' \
            '### 安装' \
            '' \
            '```bash' \
            'pip install ./<wheel文件名> --extra-index-url https://flashinfer.ai/whl/' \
            '```' \
            > /tmp/release-notes.md
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${WHEEL}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${WHEEL}" \
              --title "vLLM wheel for Xing4.0 (py3.12 / CUDA 13.0)" \
              --notes-file /tmp/release-notes.md
          fi
          gh release view "${RELEASE_TAG}"
