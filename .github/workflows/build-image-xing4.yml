name: Build & push vLLM image (Xing4.0)

# 手动触发：Actions 页面 → Run workflow。
# 镜像构建比 wheel 慢且吃磁盘（要拉 ~9GB 基础镜像），所以不做 push 自动触发。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker 镜像 tag"
        required: true
        default: "xing4.0-py312-cu130"

permissions:
  contents: read

concurrency:
  group: image-xing4
  cancel-in-progress: false

env:
  IMAGE_REPO: huiiw/vllm

jobs:
  build:
    runs-on: [self-hosted, linux, x64, vllm-builder]
    timeout-minutes: 480
    env:
      CUDA_HOME: /usr/local/cuda-13.0
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime,file_macro,locale
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup toolchain paths
        run: |
          echo "${CUDA_HOME}/bin" >> "${GITHUB_PATH}"
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          export PATH="${CUDA_HOME}/bin:${HOME}/.cargo/bin:${PATH}"
          nvcc --version
          ccache --version
          cargo --version
          docker --version
          df -h /

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          python -m pip install -U pip
          pip install -r requirements/build/cuda.txt

      - name: Build wheel
        env:
          # 冷构建（无 ccache）内存尖峰很大，留足余量给 runner 心跳/系统
          MAX_JOBS: "8"
          NVCC_THREADS: "1"
        run: |
          set -euxo pipefail
          ccache -M 30G
          ccache -z
          python -m build --wheel --no-isolation -o dist
          ccache -s
          ls -lh dist

      - name: Build image
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euxo pipefail
          # 只把 wheel 放进构建上下文，避免把整个仓库（含 .git）传给 docker
          CTX=$(mktemp -d)
          cp dist/*.whl "${CTX}/"
          docker build -f .github/docker/Dockerfile.xing4 -t "${IMAGE_REPO}:${TAG}" "${CTX}"
          rm -rf "${CTX}"
          docker images "${IMAGE_REPO}"

      - name: Push image to Docker Hub
        env:
          TAG: ${{ inputs.tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euxo pipefail
          echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
          docker push "${IMAGE_REPO}:${TAG}"
          docker logout
          # 清理被新 tag 顶掉的旧镜像层，避免 197GB 磁盘被逐次构建吃满
          docker image prune -f
          df -h /